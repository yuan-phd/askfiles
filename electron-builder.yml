# Packaging for macOS arm64 and Windows x64. macOS only on a Mac: npm run package:mac (see
# docs/packaging.md). Windows only on Windows, the GitHub windows-latest runner: npm run package:win
# (docs/windows.md); native modules need Windows binaries, so nothing is cross-built. The upstream
# tree must be prepared first by scripts/build.sh with PACKAGE_TARGET=mac-arm64 or win-x64, which
# the package scripts do.
appId: io.askfiles.desktop
productName: AskFiles
copyright: Copyright AskFiles contributors

directories:
  output: release
  buildResources: build

# Only the shell's own compiled main process, its pages and its runtime dependencies (chokidar,
# mammoth, pdfjs-dist, read-excel-file, xlsx, the tesseract language data) go into app.asar. pdfjs-dist
# pulls the optional @napi-rs/canvas, an N-API prebuild, so nothing needs a rebuild for Electron;
# electron-builder unpacks its .node file to app.asar.unpacked, where scripts/sign-adhoc.sh signs
# it with the rest of Resources.
npmRebuild: false
files:
  - package.json
  - dist/main/**
  # Read at every launch for the server spawn environment (src/main/app.ts).
  - config/presets.json
  # Library profiles for the library graph (docs/profiles.md).
  - config/profiles/**
  # The pages, served to the window as askfiles://app/... (src/main/app-protocol.ts).
  - src/renderer/**
  - '!src/renderer/**/*.test.js'
  # The test UI pages never ship from here: the test build serves its copy in dist/main/test-record/ui
  # (scripts/build-main.mjs --flavour test), and the release build has no dist/main/test-record.
  # CI runs scripts/check-test-record.mjs on both (docs/test-build.md).
  - '!src/renderer/test-record/**'
  # Shown on the About page.
  - THIRD-PARTY-NOTICES
  # OCR data is seeded from 4.0.0_best_int only (src/main/tesseract.ts); the 4.0.0 copies add 30 MB.
  - '!node_modules/@tesseract.js-data/*/4.0.0/**'
  # SheetJS reads legacy .xls through require('xlsx'), which is xlsx.js; the browser builds in
  # dist/ and the ES module copy add 6.8 MB and are never loaded.
  - '!node_modules/xlsx/dist/**'
  - '!node_modules/xlsx/xlsx.mjs'
  # The Graph page loads only d3's prebuilt dist/d3.min.js (src/main/app-protocol.ts VENDOR_FILES),
  # which holds every d3 module; the separate modules, their sources and the unminified copy are
  # never loaded. Their licenses stay listed in THIRD-PARTY-NOTICES, as their code is in the bundle.
  - '!node_modules/d3/src/**'
  - '!node_modules/d3/dist/d3.js'
  - '!node_modules/d3-*/**'
  - '!node_modules/{internmap,delaunator,robust-predicates,commander,iconv-lite,rw,safer-buffer}/**'

# Server and collector ship as plain folders in Contents/Resources, not in app.asar
# (docs/upstream-analysis.md Q1, Q2, risks 1 and 4): Prisma's schema engine and ripgrep are spawned
# as executables, the Prisma runtime has no asar awareness, and native modules load from real paths.
# They run as child processes under ELECTRON_RUN_AS_NODE; all native modules are N-API (Q1).
# Writable data must go to ~/Library/Application Support/AskFiles; the patches that move the DB,
# hotdir and .env out of these folders are Session C's work (analysis risk 1).
extraResources:
  - from: upstream/server
    to: server
    filter:
      - '**/*'
      # public/ is the frontend build from scripts/build.sh and is shipped.
      - '!storage/**'
      - '!.env*'
      - '!__tests__/**'
      # swagger/ stays: endpoints/api/index.js requires swagger/utils at boot.
      - '!{nodemon.json,eslint.config.mjs,jsconfig.json,yarn.lock}'
  # electron-builder drops a node_modules folder sitting directly under `from`, whatever the
  # filter says (app-builder-lib util/filter.js, createFilter), so each one is its own entry.
  - from: upstream/server/node_modules
    to: server/node_modules
    filter: &node-modules-filter
      - '**/*'
      - '!.install_pkgs.sha256'
      - '!.askfiles-build-stamp'
      # Binaries for other platforms, dev files and unused packages are already gone: scripts/build.sh
      # runs scripts/prune.mjs for PACKAGE_TARGET=mac-arm64 (docs/bundle-report.md).
  - from: upstream/collector
    to: collector
    filter:
      - '**/*'
      - '!storage/**'
      - '!hotdir/**'
      - '!.env*'
      - '!__tests__/**'
      - '!{nodemon.json,eslint.config.mjs,yarn.lock}'
  - from: upstream/collector/node_modules
    to: collector/node_modules
    filter: *node-modules-filter
  # The default logo images are the only tracked files in server/storage worth shipping; Session C
  # can seed the data directory from them. Everything else in storage/ is local runtime data.
  - from: upstream/server/storage/assets
    to: server/storage/assets
  - from: upstream/LICENSE
    to: licenses/anything-llm-LICENSE
  # The Ollama release for the platform, extracted into resources/ollama (not committed; see
  # docs/packaging.md and docs/windows.md). Kept whole on the Mac: the binary loads its libraries
  # from its own folder and the license files must ship with it (analysis Q12). On Windows
  # scripts/lib/ollama-runtimes.mjs first removes the GPU runtimes other than CUDA 12.
  - from: resources/ollama
    to: ollama

mac:
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.productivity
  # No Apple Developer certificate: electron-builder skips signing and scripts/sign-adhoc.sh signs
  # the whole bundle afterwards.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: AskFiles-${version}-arm64.dmg

# Windows x64, unsigned (docs/windows.md, SmartScreen). The shell stays in app.asar, which keeps its
# paths short under the 260 character limit; server, collector and ollama are plain folders in
# resources, as on the Mac. The workflow checks the longest installed path.
win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  # No certificate: electron-builder skips signing. rcedit still writes the version and name into
  # AskFiles.exe.
  signAndEditExecutable: true
  # The portable zip; nsis.artifactName below names the installer. Unpack anywhere and run
  # AskFiles.exe; it keeps its data in %LOCALAPPDATA%\AskFiles like the installed app.
  artifactName: AskFiles-${version}-x64-portable.${ext}

# One-click per-user install into %LOCALAPPDATA%\Programs\AskFiles: no administrator prompt and
# no UAC. /S installs silently (the smoke job). Data stays in %LOCALAPPDATA%\AskFiles and survives
# an uninstall unless the user removes it (docs/windows.md).
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: AskFiles-${version}-x64-setup.${ext}
  shortcutName: AskFiles
