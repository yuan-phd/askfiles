<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'"
    />
    <title>AskFiles models</title>
    <link rel="stylesheet" href="../search/search.css" />
    <link rel="stylesheet" href="../shared/pages.css" />
    <script type="module" src="./models.js"></script>
  </head>
  <body>
    <main class="page">
      <h1>Models</h1>
      <p class="lead">Language models stored on this Mac. The one marked for answers replies to your questions.</p>

      <div id="message" class="error" role="alert" data-testid="message" hidden></div>

      <table class="models">
        <thead>
          <tr>
            <th scope="col">Model</th>
            <th scope="col">Size</th>
            <th scope="col">Used for</th>
            <th scope="col"><span class="visually-hidden">Actions</span></th>
          </tr>
        </thead>
        <tbody id="model-rows" data-testid="model-rows"></tbody>
      </table>

      <h2>Download a model</h2>
      <form id="pull-form" class="pull" autocomplete="off">
        <label class="visually-hidden" for="pull-tag">Model name</label>
        <input id="pull-tag" data-testid="pull-tag" placeholder="for example qwen3:8b" spellcheck="false" />
        <button type="submit" class="primary" id="pull-submit" data-testid="pull-submit">Download</button>
      </form>
      <div id="progress" class="progress" hidden>
        <progress id="progress-bar" data-testid="progress-bar" max="100" value="0">0%</progress>
        <p id="progress-text" class="note" data-testid="progress-text"></p>
      </div>
    </main>
  </body>
</html>
